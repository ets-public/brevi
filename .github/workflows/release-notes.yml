# Rewrites an existing release's notes from its section of CHANGELOG.md (tools/release_notes.py),
# so release pages stay current when the changelog is corrected after a release.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.18.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 tools/release_notes.py "$TAG" > notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
