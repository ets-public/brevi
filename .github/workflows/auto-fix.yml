# When the toolchain watch or the upstream watch opens an issue, Claude Code works on it and opens a
# pull request with the fix or the adopted feature. A human still reviews and merges every PR.
# Off until the repository has an ANTHROPIC_API_KEY secret (Settings > Secrets and variables > Actions).
name: Auto-fix

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  fix:
    # Only issues opened by the watch workflows or by people with write access: the issue text becomes
    # Claude's prompt, and this job can push and open PRs, so an outsider's issue must never reach it,
    # even after someone adds the label.
    if: >
      github.event_name == 'workflow_dispatch' ||
      ((contains(github.event.issue.labels.*.name, 'toolchain') ||
        contains(github.event.issue.labels.*.name, 'upstream')) &&
       (github.event.issue.user.login == 'github-actions[bot]' ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: auto-fix-${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Needs an API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: '[ -n "$KEY" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "No ANTHROPIC_API_KEY secret; skipping."'
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
        with: { fetch-depth: 0 }
      - name: Install Rust
        if: steps.key.outputs.ok == 'true'
        run: rustup toolchain install stable beta nightly --profile minimal --no-self-update
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        env:
          # So `gh` inside Claude's session can read issues, comment and open PRs.
          GH_TOKEN: ${{ github.token }}
          # tools/compat.py takes about 7 minutes; let it run in the foreground.
          BASH_DEFAULT_TIMEOUT_MS: "1500000"
          BASH_MAX_TIMEOUT_MS: "2400000"
        with:
          # Full transcript in the job log, so a run that ends without a PR can be diagnosed.
          show_full_output: true
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Work on issue #${{ github.event.issue.number || inputs.issue }} in ${{ github.repository }}. Read it with gh.
            First comment on the issue that you are starting. If anything blocks you (a failing command, no
            permission to push or open a PR), comment on the issue with the exact error before you stop.
            Brevi is a language that compiles to Rust (compiler in src/, guide BREVI.md, AGENTS.md has the rules).
            Rule: code that once passed must never break. `python3 tools/compat.py check` must pass and
            `sh tests/check.sh` must pass after `cargo build`. Never edit compat/baseline.txt to hide a failure.
            For a toolchain break: reproduce it with the named toolchain (`rustup run <toolchain> ...`), fix Brevi
            so old programs keep working on both the old and the new toolchain, add a test in tests/run or tests/errors.
            For a release review: adopt only items that make Brevi programs shorter, faster or more correct,
            each with a test; explain in the PR why the others were skipped. Keep changes small.
            Never run commands in the background: your session ends the moment you reply, so run every check
            in the foreground and wait for it. Before you finish, push your branch, open a pull request that
            says "Fixes #<issue>", and comment on the issue with what you did and the PR link.
          # The runner is a throwaway VM, so let Claude build, test and use git/gh freely there.
          claude_args: "--max-turns 80 --allowedTools Bash,Read,Edit,Write,Glob,Grep"
      - name: Safety net - push work Claude committed but did not publish
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          b=$(git rev-parse --abbrev-ref HEAD)
          [ "$b" = main ] || [ "$b" = HEAD ] && exit 0
          [ -z "$(git log origin/main..HEAD --oneline)" ] && exit 0
          git push -u origin "$b"
          gh pr view "$b" >/dev/null 2>&1 || gh pr create --draft --head "$b" --title "Auto-fix for #$ISSUE (unfinished)" \
            --body "Claude committed this for #$ISSUE but the session ended before it opened a PR. Checks may not have finished; CI will run them. Fixes #$ISSUE"
      - name: Run the toolchain checks on Claude's branch
        # PRs opened with the Actions token don't trigger CI, so start it by hand; its checks show on the PR.
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=$(git rev-parse --abbrev-ref HEAD)
          if [ "$b" != main ] && [ "$b" != HEAD ] && git ls-remote --exit-code --heads origin "$b" >/dev/null; then
            gh workflow run toolchains.yml --ref "$b" -f force=true
          fi
