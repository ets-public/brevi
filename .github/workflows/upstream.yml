# Watches everything upstream of Brevi and opens a review issue for each thing that needs work (deduplicated by
# title; auto-fix.yml then works on it):
#   - new Rust stable, Python, pinned-crate and MCP specification releases (tools/upstream_watch.py)
#   - new releases of the Python libraries Brevi mirrors natively, with a CPython run of their tests on the pinned
#     and the new version to show exactly what changed (tools/parity_drift.py, tools/upstream_pins.json)
#   - security advisories from OSV (RustSec, GitHub, PyPA) for all dependencies (tools/advisories.py)
# Linux only and no Brevi build: about 5 minutes a run. Saturday's run feeds the Sunday report before the
# Monday release.
name: Upstream releases

on:
  schedule:
    - cron: "41 6 * * 1,4,6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create upstream --color 0E8A16 --description "New Rust/Python/crate release to review" 2>/dev/null || true
          gh label create security --color B60205 --description "Security advisory in a dependency" 2>/dev/null || true
      - name: Check for new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream_watch.py
      - name: Security advisories
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/advisories.py --issue | tee -a "$GITHUB_STEP_SUMMARY"

  parity:
    needs: watch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: New releases of the libraries Brevi mirrors, run against Brevi's tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/parity_drift.py | tee -a "$GITHUB_STEP_SUMMARY"
