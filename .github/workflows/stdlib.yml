# The stdlib conformance slice (tools/conformance.py --slice stdlib) on main, after every merge that can change it.
# Pull requests run only the core slice: the stdlib slice takes about 6 minutes more, which would push the PR tier
# past 20 minutes. And two PRs that each pass on their own can still leave a wrong result once both are merged
# (#468 and #471 did), which no per-PR run sees. This catches both within one run of the merge instead of at the
# next daily run, for about 12 minutes per burst of merges: a newer merge cancels the run in progress, so a busy
# afternoon costs one run, not one per PR. A failure opens or updates a "conformance" issue.
name: Stdlib conformance on main

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/conformance.py"
      - "compat/conformance_stdlib_*"
      - "compat/conformance_by_design.txt"
      - ".github/workflows/stdlib.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stdlib-conformance-main
  cancel-in-progress: true

jobs:
  stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BREVI_CACHE_MB: "6144"
      BREVI_TIERED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust stable
        id: fp
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "rustc_hash=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Reuse the daily run's build cache (read only)
        # The same entry pull requests reuse; this workflow never saves one.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/brevi
          key: brevi-build-${{ steps.fp.outputs.rustc_hash }}-${{ github.run_id }}
          restore-keys: brevi-build-${{ steps.fp.outputs.rustc_hash }}-

      - name: Build
        run: cargo build --release

      - name: CPython conformance, stdlib slice (the score may not drop, the known-wrong list only shrinks)
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13.13 --quiet
          python3 tools/conformance.py --slice stdlib --check --python "$(uv python find 3.13.13)" --out conformance-stdlib
          cat conformance-stdlib/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Stdlib conformance dropped on main"
          {
            echo "The stdlib conformance slice failed on main after a merge. Each PR passed its own checks, so a merge (or two merges together) left a new wrong result or a lower score. Fix it before the next release: the release gate holds the stdlib slice to its floor."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit ${{ github.sha }}"
            echo
            [ -f conformance-stdlib/report.md ] && sed -n '1,60p' conformance-stdlib/report.md || echo "Failed before the conformance run; see the run log."
          } > body.md
          gh label create conformance --color D93F0B --description "CPython conformance dropped" 2>/dev/null || true
          n=$(gh issue list --state open --label conformance --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "$title" --label conformance --body-file body.md
          fi
