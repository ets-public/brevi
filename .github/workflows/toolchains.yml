# Keeps Brevi working on every new Rust and Python release.
# Daily: builds Brevi and rebuilds every benchmark solution that ever passed (compat/baseline.txt)
# on Rust stable and the next Python pre-release; Mondays also on Rust beta and nightly.
# A toolchain that was already tested at this commit is skipped, so quiet days cost almost nothing.
# Any failure on the schedule opens (or updates) a GitHub issue labelled "toolchain".
# Actions minutes are limited, so: no run on pushes to main (the PR and the daily run cover it),
# pull requests test Rust stable only, skip draft PRs and docs/site/conformance-list-only changes, rebuild the old
# Brevi solutions only when the compiler or the baseline changed (the Rust and Python ones only when
# they themselves changed), and reuse the build cache the daily run saved, so test programs whose
# generated Rust didn't change aren't recompiled. The daily run always starts cold and runs everything.
# The release (release.yml) calls this workflow with release: true on the commit it ships: the same checks as the
# daily run, never skipped as already tested, plus the stdlib conformance slice (which main also runs after each
# merge that can change it: conformance-main.yml).
# The daily run and the release also run the duckdb, onnxruntime and mcp sections on CPython 3.13 with the real
# packages (tests/requirements-native.txt), where a native-copy check that cannot run fails instead of skipping.
# Run tools/ci_local.sh before merging.
name: Toolchains

on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!site/**"
      - "!**/*.md"
      - "BREVI.md"
      - "REFERENCE.md"
      - "!bench/logs/**"
      - "!bench/tokcache.json"
      - "!skills/**"
      - "!plugins/**"
      - "!reserve/**"
      # Conformance lists: only tools/conformance.py reads them, and PR CI runs it only when src/ changes too.
      # A PR changing nothing but files this list skips merges on tools/ci_local.sh alone (AGENTS.md, "Before merging").
      - "!compat/conformance_known_wrong/**"
      - "!compat/conformance_stdlib_known_wrong/**"
      - "!compat/conformance_by_design.txt"
      - "!compat/conformance_cpython_private.txt"
      - "!compat/conformance_needs_string_model.txt"
      - "!tools/conformance_candidates.json"
  workflow_call:
    inputs:
      release:
        description: "Called by release.yml for the commit it ships"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this toolchain was already tested at this commit"
        type: boolean
        default: false
      full:
        description: "Test every toolchain (Rust stable, beta, nightly and the next Python), not just stable"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  # A release's own run never shares a group with (or is cancelled by) the daily or a manual run on main.
  group: ${{ inputs.release && format('release-suite-{0}', github.run_id) || format('toolchains-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  versions:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next_python: ${{ steps.py.outputs.next }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Workflows open no way in for untrusted code (pinned actions, no secrets on PRs, no script injection)
        run: python3 tools/workflow_guard.py
      - name: No credentials in tracked files
        run: python3 tools/secret_scan.py
      - name: No built programs or large files in git
        run: python3 tools/no_binaries.py
      - name: The --limit platform claims (MCP schema, docs) match the code
        run: python3 tools/limits_check.py
      - name: Every src file says what it holds (tools/code_map.py), and the agent hooks hold
        run: python3 tools/code_map.py --check && python3 tests/agent_hooks_test.py
      - id: py
        name: Find the next Python release (pre-release)
        # Never blocks the matrix: if the lookup fails, fall back to a guess.
        run: |
          next=$(curl -fsSL --retry 3 https://endoflife.date/api/python.json | python3 -c '
          import json, sys
          c = max(json.load(sys.stdin), key=lambda c: tuple(map(int, c["cycle"].split("."))))["cycle"]
          a, b = c.split("."); print(f"{a}.{int(b) + 1}")') || next=3.16
          echo "next=${next:-3.16}" >> "$GITHUB_OUTPUT"
      - id: m
        name: Pick toolchains
        # Saves Actions minutes: PRs and manual runs test Rust stable only, the daily run adds the
        # next Python, and Monday's run (or a manual run with full) adds Rust beta and nightly.
        env:
          FULL: ${{ inputs.full }}
        run: |
          stable='{"rust":"stable","python":"3.x"}'
          next='{"rust":"stable","python":"next"}'
          weekly='{"rust":"beta","python":"3.x"},{"rust":"nightly","python":"3.x"}'
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%u)" = 1 ] || [ "$FULL" = true ]; then
            m="[$stable,$next,$weekly]"
          elif [ "${{ github.event_name }}" = schedule ]; then
            m="[$stable,$next]"
          else
            m="[$stable]"
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-latest
    # A release adds the stdlib conformance slice to a cold run.
    timeout-minutes: ${{ inputs.release && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: rust ${{ matrix.rust }} / python ${{ matrix.python }}
    env:
      # Room for every test program and old solution, so the cache doesn't evict mid-run.
      BREVI_CACHE_MB: "6144"
      # No background optimised builds (src/tier.rs) for the test programs; the tiered-builds check turns them on.
      BREVI_TIERED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR checks out a merge commit; its first parent is the base, so depth 2 is enough to diff.
          fetch-depth: 2

      - name: Install Rust ${{ matrix.rust }}
        # "stable" means the pinned version in .github/rust-version, so a new Rust release can't turn every PR red
        # (Rust 1.100's Unicode 18 tables did: re.IGNORECASE is refused until they are checked against CPython).
        # Only the daily schedule tests the real latest stable, so the watch still reports a new release.
        run: |
          v=${{ matrix.rust }}
          pin=$(cat .github/rust-version)
          grep -qx "ARG RUST_VERSION=$pin" Dockerfile || { echo "::error::Dockerfile's RUST_VERSION differs from .github/rust-version ($pin)"; exit 1; }
          if [ "$v" = stable ] && [ "${{ github.event_name }}" != schedule ]; then v=$pin; fi
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"
          rustc -V

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        continue-on-error: ${{ matrix.python == 'next' }}
        with:
          python-version: ${{ matrix.python == 'next' && needs.versions.outputs.next_python || matrix.python }}
          allow-prereleases: true

      - name: Toolchain fingerprint
        id: fp
        run: |
          rustc -vV | tee /tmp/fp
          python3 -VV | tee -a /tmp/fp
          echo "key=tested-${{ matrix.rust }}-${{ matrix.python }}-${{ github.sha }}-$(sha256sum /tmp/fp | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "rustc_hash=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc -V)" >> "$GITHUB_OUTPUT"
          echo "python=$(python3 -V)" >> "$GITHUB_OUTPUT"

      - name: Already tested?
        id: seen
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)) && !inputs.release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/fp
          key: ${{ steps.fp.outputs.key }}
          lookup-only: true

      - name: Reuse the daily run's build cache (pull requests)
        # Brevi's cache keys every binary by its generated Rust, the build flags, the rustc version and the
        # runtime's own hash, so a reused entry is the binary a fresh build would make; a PR only rebuilds the
        # programs whose generated Rust it changes (language tests ~4.5 min cold, ~40 s warm). The replay
        # cache (runs/) is never saved, so whole runs are always redone by the PR's own compiler.
        if: github.event_name == 'pull_request' && matrix.rust == 'stable'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/brevi
          key: brevi-build-${{ steps.fp.outputs.rustc_hash }}-${{ github.run_id }}
          restore-keys: brevi-build-${{ steps.fp.outputs.rustc_hash }}-

      - name: Build
        if: steps.seen.outputs.cache-hit != 'true'
        run: cargo build --release

      - name: Does this PR change the compiler or the baseline?
        id: scope
        # Rebuilding the ~1,900 old solutions takes about 6 minutes, so PRs that only touch docs,
        # tests, tools or the guide skip it. The daily run always does it.
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            { echo "compat=true"; echo "kinds=brevi,python,rust"; echo "grammar=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|Cargo\.(toml|lock)$|compat/baseline\.txt$|tools/compat\.py$|bench/(solutions|tasks|ref)/)'; then
            echo "compat=true" >> "$GITHUB_OUTPUT"
          fi
          # The Rust and Python solutions never go through Brevi, so a compiler change can't break them;
          # (compat/ also holds the conformance ratchet's lists, which this check never reads)
          # rebuild them only when they, their tests or the checker change.
          if echo "$changed" | grep -qE '^(compat/baseline\.txt$|tools/compat\.py$|bench/(solutions|tasks)/)'; then
            echo "kinds=brevi,python,rust" >> "$GITHUB_OUTPUT"
          else
            echo "kinds=brevi" >> "$GITHUB_OUTPUT"
          fi
          # grammar/brevi.lark is separate from the compiler's parser: only the grammar, the programs it
          # parses or its tools can change the result.
          if echo "$changed" | grep -qE '^(grammar/|tests/run/|bench/solutions/|compat/baseline\.txt$|tools/(grammar_check|lark_to_gbnf)\.py$|tools/requirements-ci\.txt$)'; then
            echo "grammar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The conformance floors are left to main (pull requests)
        # conformance-main.yml raises them after each merge; PRs that raised them conflicted with every other open PR.
        if: github.event_name == 'pull_request'
        run: python3 tools/floor_guard.py HEAD^1

      - name: CHANGELOG.md and the published scores are left alone (pull requests)
        # Only the release PR writes CHANGELOG.md, and only the docs thread ("[scores]" PRs) the score lines.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/pr_guard.py HEAD^1

      - name: Unit tests
        if: steps.seen.outputs.cache-hit != 'true'
        run: cargo test --release

      - name: Language tests (tests/run, tests/errors)
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          BREVI: ./target/release/brevi
        # check.sh in parallel, one job per CPU (the same checks, the same report)
        run: python3 tests/check_parallel.py

      # The language tests above skip these sections (this runner's Python has no duckdb, onnxruntime or mcp, and the
      # newest Python may have no wheels for them yet). The daily run and the release run them on CPython 3.13 with the
      # pinned packages, where a section that cannot run fails instead of skipping.
      - name: Native copies against the real duckdb, onnxruntime and mcp (daily and release; never skipped)
        if: steps.seen.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && matrix.rust == 'stable' && matrix.python == '3.x'
        env:
          BREVI: ./target/release/brevi
          CHECK_REQUIRE_LIBS: "1"
          CHECK_ONLY: duckdb,onnxruntime,mcp_sdk,mcp_http
        run: |
          python3 -m pip install --quiet uv
          uv venv --quiet --python 3.13.13 "$RUNNER_TEMP/native"
          uv pip install --quiet --python "$RUNNER_TEMP/native/bin/python" -r tests/requirements-native.txt
          PATH="$RUNNER_TEMP/native/bin:$PATH" python3 tests/check_parallel.py
          # Brevi's own MCP server over HTTP, driven by the official client
          PATH="$RUNNER_TEMP/native/bin:$PATH" python3 tests/mcp_http_test.py

      # Pull requests: the MCP sections alone against the real mcp and the pydantic it prints errors with (the same pins
      # as the daily run, without duckdb and onnxruntime, about a minute), so a change to Brevi's mcp or pydantic copy,
      # or a pin bump without new transcripts, fails on the PR instead of the next day.
      - name: MCP servers against the real mcp (pull requests; never skipped)
        if: steps.seen.outputs.cache-hit != 'true' && github.event_name == 'pull_request' && matrix.rust == 'stable' && matrix.python == '3.x'
        env:
          BREVI: ./target/release/brevi
          CHECK_REQUIRE_LIBS: "1"
          CHECK_ONLY: mcp_sdk,mcp_http
        run: |
          python3 -m pip install --quiet uv
          uv venv --quiet --python 3.13.13 "$RUNNER_TEMP/mcp"
          grep -vE '^(duckdb|onnxruntime)==' tests/requirements-native.txt > "$RUNNER_TEMP/mcp-requirements.txt"
          uv pip install --quiet --python "$RUNNER_TEMP/mcp/bin/python" -r "$RUNNER_TEMP/mcp-requirements.txt"
          PATH="$RUNNER_TEMP/mcp/bin:$PATH" python3 tests/check_parallel.py

      - name: MCP server tests
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tests/mcp_test.py && python3 tests/mcp_http_test.py

      - name: Python SDK and brevi-python
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          BREVI: ./target/release/brevi
        run: python3 tests/sdk_test.py && node tests/sdk_node_test.mjs

      - name: Core guide stays under its token budget
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tools/guide_budget.py

      - name: Package manifests match Cargo.toml
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tools/version_sync.py

      - name: Changelog fragments are CHANGELOG lines
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tools/changelog.py --check

      - name: Grammar accepts every test program, and the GBNF copy is current
        if: steps.seen.outputs.cache-hit != 'true' && steps.scope.outputs.grammar == 'true'
        run: |
          python3 -m pip install --quiet -r tools/requirements-ci.txt
          python3 tools/lark_to_gbnf.py --check
          python3 tools/grammar_check.py tests/run/*.bv

      - name: Every solution that ever passed still passes
        if: steps.seen.outputs.cache-hit != 'true' && steps.scope.outputs.compat == 'true'
        run: python3 tools/compat.py check --kinds ${{ steps.scope.outputs.kinds }} --report compat-report.md

      - name: CPython conformance ratchet (CPython's own tests; the score may not drop, the known-wrong list only shrinks)
        # Only when the compiler could have changed, on one toolchain: the run takes about 10 minutes. The pinned
        # test files come from python/cpython at the tag in tools/conformance.py and are checked against their hashes.
        if: steps.seen.outputs.cache-hit != 'true' && steps.scope.outputs.compat == 'true' && matrix.rust == 'stable' && matrix.python == '3.x'
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13.13 --quiet
          # A release also holds each slice to its absolute bar (release_gate in compat/conformance*_floor.json: core 90%,
          # stdlib 80%, no known-wrong result). Below it, nothing is released or published.
          gate=""; [ "$RELEASE" = true ] && gate="--release-gate"
          python3 tools/conformance.py --check $gate --python "$(uv python find 3.13.13)" --out conformance-report
          cat conformance-report/report.md >> "$GITHUB_STEP_SUMMARY"
          # The stdlib slice (itertools, collections, re, ...) takes as long again, so only the daily run and a release check it.
          if [ "${{ github.event_name }}" = schedule ] || [ "$RELEASE" = true ]; then
            python3 tools/conformance.py --slice stdlib --check $gate --python "$(uv python find 3.13.13)" --out conformance-stdlib
            cat conformance-stdlib/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fuzz for panics (generated programs; a panic, signal or compiler crash fails the run)
        # Pull requests replay the saved corpus (bench/fuzz/corpus: once-failing cases that must stay fixed); the daily
        # run also tries 60 fresh batches of 12 cases, seeded by the date so a failure reproduces. Wrong answers are
        # listed in the summary, not failed on, until the known ones are fixed.
        if: steps.seen.outputs.cache-hit != 'true' && steps.scope.outputs.compat == 'true' && matrix.rust == 'stable' && matrix.python == '3.x'
        run: |
          python3 tools/fuzz.py --replay bench/fuzz/corpus --jobs 4
          if [ "${{ github.event_name }}" = schedule ]; then
            python3 tools/fuzz.py --seed "$(date -u +%Y%m%d)" --batches 60 --jobs 4 --out fuzz-found | tee fuzz.log
            { echo '## Fuzz'; echo '```'; tail -40 fuzz.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep what the fuzzer found
        if: failure() && hashFiles('fuzz-found/*.py') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-found
          path: fuzz-found/

      - name: Early warnings in generated Rust (deprecations, future incompatibilities, newest edition)
        if: steps.seen.outputs.cache-hit != 'true' && matrix.rust == 'nightly'
        continue-on-error: true
        run: |
          python3 tools/compat.py lints --report lints-report.md
          cat lints-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Bench scripts still compile
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 -m py_compile bench/*.py bench/ref/*.py tools/*.py

      - name: Agent platform templates (static checks)
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 templates/test.py

      - name: Drop the replay cache and machine-specific paths before saving
        if: >
          success() && steps.seen.outputs.cache-hit != 'true' && matrix.rust == 'stable' && matrix.python == '3.x' &&
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rm -rf ~/.cache/brevi/runs ~/.cache/brevi/toolchain

      - name: Save the build cache for pull requests
        # Only the daily (and manual main) run saves it, so a PR can never seed what other PRs reuse. The run
        # started cold, so every entry came from this commit's compiler. One entry per day; GitHub evicts old ones.
        if: >
          success() && steps.seen.outputs.cache-hit != 'true' && matrix.rust == 'stable' && matrix.python == '3.x' &&
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/brevi
          key: brevi-build-${{ steps.fp.outputs.rustc_hash }}-${{ github.run_id }}

      - name: Remember this toolchain passed
        if: success() && steps.seen.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/fp
          key: ${{ steps.fp.outputs.key }}

      - name: Open or update an issue
        if: failure() && !inputs.release && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Toolchain break: Rust ${{ matrix.rust }} / Python ${{ matrix.python }}"
          {
            echo "The daily toolchain check failed. Code that once passed must never silently break, so this needs a fix in Brevi (or a bug report upstream if the toolchain is at fault)."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- ${{ steps.fp.outputs.rustc }}, ${{ steps.fp.outputs.python }}, commit ${{ github.sha }}"
            echo
            [ -f compat-report.md ] && cat compat-report.md || echo "Failed before the compatibility check; see the run log."
          } > body.md
          gh label create toolchain --color B60205 --description "Breakage on a new Rust or Python release" 2>/dev/null || true
          n=$(gh issue list --state open --label toolchain --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "$title" --label toolchain --body-file body.md
          fi
