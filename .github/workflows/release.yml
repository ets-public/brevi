# Prebuilt brevi binaries. Push a tag like v0.17.0 (or run this by hand) and each
# platform's binary is built, smoke-tested and attached to that GitHub release, then published to
# PyPI (`pip install brevi`), npm (`npx brevi`), crates.io (`cargo install brevi`) and the MCP registry,
# and the sandbox image is pushed to ghcr.io/ets-public/brevi-sandbox (templates/image/Dockerfile).
# Publishing uses trusted publishing (OIDC): no tokens are stored in the repo. Each registry trusts
# this file by name (release.yml), so renaming it breaks publishing. See packaging/README.md.
# A release ships only what it tested: the full Linux suite (toolchains.yml with release: true: unit, language and
# MCP tests, every old solution, both CPython conformance slices held to their release gates (core 90%, stdlib
# 80%, no known-wrong result), the fuzz corpus) runs on the commit being released,
# Windows runs tests/windows/check.ps1 on the brevi.exe unpacked from the zip it ships, every archive is unpacked and
# run (tools/archive_check.py), and SHA256SUMS is checked against the files as published. Nothing is released or
# published unless every platform built and passed. dry_run does all of that and stops before the release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (made if missing), e.g. v0.17.0"
        required: true
      publish:
        description: "Publish to PyPI, npm, crates.io and the MCP registry (skipped for versions already there)"
        type: boolean
        default: true
      from_release:
        description: "Skip the build: publish the binaries already attached to this release (crates.io is skipped, since it publishes source)"
        type: boolean
        default: false
      dry_run:
        description: "Build and run every release check, then stop: no GitHub release, no publishing"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  # Fails in a minute what would otherwise fail after the builds: a tag that is not Cargo.toml's version, or a tag
  # that already exists on another commit than the one being built.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/version_sync.py --tag "$TAG"
      # (A dry run attaches nothing, so it may rehearse a tag already released from an earlier commit.)
      - name: The tag, if it exists, is this commit
        if: ${{ !inputs.from_release && !inputs.dry_run }}
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          at=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | head -1 | cut -f1)
          # ^{} (the commit an annotated tag points at) sorts after the plain ref, so prefer it when present.
          peeled=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$peeled" ] && at=$peeled
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "tag $TAG is at $at, but this run builds $GITHUB_SHA"; exit 1
          fi
          echo "tag $TAG: ${at:-not made yet}; building $GITHUB_SHA"

  # The whole Linux suite on the commit being released, never skipped as already tested.
  suite:
    needs: [preflight]
    if: ${{ !inputs.from_release }}
    uses: ./.github/workflows/toolchains.yml
    with:
      release: true
    permissions:
      contents: read
      issues: write
      actions: write

  # Actions minutes are shared and metered (macOS counts 10x, Windows 2x), so: one macOS job builds both Mac
  # targets, the Linux suite runs once (the suite job, same source, compiler and flags), and Windows runs its own
  # platform checks (tests/windows/check.ps1, about 10 minutes) because nothing else tests Windows at this commit.
  build:
    needs: [preflight]
    if: ${{ !inputs.from_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, targets: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, targets: aarch64-unknown-linux-gnu }
          # Intel Mac images are being retired, so the Intel binary is cross-built on Apple silicon (and run under Rosetta).
          - { os: macos-15, targets: aarch64-apple-darwin x86_64-apple-darwin }
          - { os: windows-2022, targets: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust (pinned in .github/rust-version)
        shell: bash
        run: |
          v=$(cat .github/rust-version)
          rustup toolchain install "$v" --profile minimal --no-self-update
          for t in ${{ matrix.targets }}; do rustup target add --toolchain "$v" "$t"; done
          rustup default "$v"
          rustc -V
      - name: Build
        shell: bash
        run: for t in ${{ matrix.targets }}; do cargo build --release --locked --target $t; done
      - name: Smoke test (native target)
        shell: bash
        run: |
          t=$(echo ${{ matrix.targets }} | cut -d' ' -f1)
          printf 'n = 1 + 1\nprint("hi {n}")\n' > smoke.bv
          ./target/$t/release/brevi run smoke.bv | grep -qx "hi 2"
      # The checks compare with CPython 3.12+ behaviour; the runners' own Pythons differ, so pin one as toolchains.yml does.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Package
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            name=brevi-$t
            mkdir $name
            if [ "$RUNNER_OS" = Windows ]; then cp target/$t/release/brevi.exe $name/; else cp target/$t/release/brevi $name/; fi
            cp LICENSE README.md BREVI.md $name/
            # brevi-python: the same binary acting as python3 (see `brevi python`).
            if [ "$RUNNER_OS" != Windows ]; then ln -s brevi $name/brevi-python; fi
            if [ "$RUNNER_OS" = Windows ]; then 7z a $name.zip $name >/dev/null; else tar czf $name.tar.gz $name; fi
          done
      # Each archive as a user gets it: unpacked into an empty folder, its brevi must say this version and build and
      # run a typed and a dynamic program.
      - name: Unpack and run each archive
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for t in ${{ matrix.targets }}; do
            a=brevi-$t.tar.gz; [ "$RUNNER_OS" = Windows ] && a=brevi-$t.zip
            arch=; [ "$RUNNER_OS" = macOS ] && [ "$t" = x86_64-apple-darwin ] && arch="--arch x86_64"
            python tools/archive_check.py "$a" "$TAG" $arch | tee check.log
            [ "$t" = x86_64-pc-windows-msvc ] && echo "BREVI_SHIPPED=$(tail -1 check.log | tr -d '\r')" >> "$GITHUB_ENV"
          done
          rm -f check.log
      # Required, never optional: a green job means every native-copy check ran.
      - name: Python packages the Windows checks compare with (pinned)
        if: ${{ matrix.test }}
        run: python -m pip install --quiet -r tests/requirements-native.txt
      - name: Windows platform checks, on the brevi.exe from the zip
        if: ${{ matrix.test }}
        shell: pwsh
        run: |
          $env:BREVI = $env:BREVI_SHIPPED
          pwsh -NoProfile -File tests/windows/check.ps1
          if ($LASTEXITCODE -ne 0) { throw "tests/windows/check.ps1 failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brevi-${{ matrix.os }}
          path: brevi-*.*
  # The shipped Linux x86-64 binary must be byte-for-byte what its source gives: it is built again here, from a
  # fresh checkout in another folder with the same toolchain, and the two must be identical. Also records the
  # rustc version for the SBOM.
  reproducible:
    needs: [preflight, build]
    if: ${{ !inputs.from_release }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rustc: ${{ steps.again.outputs.rustc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: rebuilt-here
      - name: Rust (pinned in .github/rust-version)
        shell: bash
        run: |
          v=$(cat rebuilt-here/.github/rust-version)
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"
          rustc -V
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: brevi-ubuntu-22.04
          path: shipped
      - name: Build again and compare
        id: again
        run: |
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          (cd rebuilt-here && cargo build --release --locked --target x86_64-unknown-linux-gnu)
          tar xzf shipped/brevi-x86_64-unknown-linux-gnu.tar.gz -C shipped
          a=$(sha256sum < shipped/brevi-x86_64-unknown-linux-gnu/brevi)
          b=$(sha256sum < rebuilt-here/target/x86_64-unknown-linux-gnu/release/brevi)
          echo "shipped: $a"; echo "rebuilt: $b"
          [ "$a" = "$b" ] || { echo "the shipped binary is not reproducible from this commit"; exit 1; }
  release:
    needs: [preflight, suite, build, reproducible]
    # Every platform built and passed, and the suite passed on this commit; or from_release, which publishes what is
    # already attached. A dry run stops here.
    if: ${{ !cancelled() && !inputs.dry_run && needs.preflight.result == 'success' && (inputs.from_release || (needs.build.result == 'success' && needs.suite.result == 'success' && needs.reproducible.result == 'success')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # id-token and attestations: the build-provenance attestations (signed through Sigstore with this run's identity)
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ !inputs.from_release }}
        with:
          path: dist
          merge-multiple: true
      - name: Download the release's binaries
        if: ${{ inputs.from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p 'brevi-*' -p SHA256SUMS
          cd dist && sha256sum -c SHA256SUMS
      # The SBOM (tools/sbom.py) lists each archive with its SHA-256; it is itself in SHA256SUMS.
      - name: SBOM
        if: ${{ !inputs.from_release }}
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RUSTC: ${{ needs.reproducible.outputs.rustc }}
        run: python3 tools/sbom.py --tag "$TAG" --dist dist --rustc "$RUSTC" > sbom.json && mv sbom.json dist/brevi-sbom.cdx.json
      - name: Checksums
        if: ${{ !inputs.from_release }}
        run: cd dist && sha256sum brevi-* > SHA256SUMS
      # Provenance: each archive, the SBOM and SHA256SUMS get a signed statement that this workflow built them from
      # this commit. `gh attestation verify FILE -R ets-public/brevi` checks one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.from_release }}
        with:
          subject-path: "dist/brevi-*, dist/SHA256SUMS"
      - name: Attach to release
        if: ${{ !inputs.from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Release notes: this tag's section of CHANGELOG.md, then the install note, then the run that tested it.
          python3 tools/release_notes.py "$TAG" > notes.md
          printf '\n**Tested:** these binaries were built from %s and passed the full Linux suite, the Windows platform checks and the archive checks in [this run](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Brevi $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
      # What users download, not what this job holds: every asset fetched back from the release must match
      # SHA256SUMS, and the release must hold exactly the files built.
      - name: Verify the published files
        if: ${{ !inputs.from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir published
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D published -p 'brevi-*' -p SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS)
          diff <(cd dist && ls) <(cd published && ls)
          for f in dist/brevi-*; do grep -q " $(basename "$f")\$" published/SHA256SUMS || { echo "$f is not in SHA256SUMS"; exit 1; }; done
          # each published file is attested by this repository's release workflow
          for f in published/*; do gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null || { echo "$f has no valid attestation"; exit 1; }; done
          echo "every published file has a valid build-provenance attestation"
      # PyPI wheels repack these same binaries (tools/make_wheels.py), so they cost no extra build.
      - name: Wheels
        if: ${{ needs.build.result == 'success' || inputs.from_release }}
        run: python3 tools/make_wheels.py dist wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ needs.build.result == 'success' || inputs.from_release }}
        with:
          name: wheels
          path: wheels/*.whl

  # Publishing runs only when every platform built and the tag matches Cargo.toml's version, so a
  # registry never gets a release that the GitHub release (which npm downloads from) is missing.
  # Each job skips a version that is already published, so re-running a release is safe.
  # `!cancelled()` is needed because with from_release the build job is skipped, and a job whose
  # needs include a skipped job is otherwise skipped too.
  pypi:
    needs: [build, release]
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.from_release) && needs.release.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/version_sync.py --tag "$TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  npm:
    needs: [build, release]
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.from_release) && needs.release.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/version_sync.py --tag "$TAG"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        working-directory: packaging/npm
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@^11.5.1
          v=$(node -p 'require("./package.json").version')
          if [ "$(npm view "brevi@$v" version 2>/dev/null)" = "$v" ]; then echo "brevi@$v is already on npm"; exit 0; fi
          npm publish --access public

  crates:
    needs: [build, release]
    if: ${{ needs.build.result == 'success' && needs.release.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/version_sync.py --tag "$TAG"
      - name: Already published?
        id: check
        run: |
          v=$(python3 -c 'import re;print(re.search(r"^version = \"([^\"]+)\"",open("Cargo.toml").read(),re.M)[1])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'brevi-release (github.com/ets-public/brevi)' "https://crates.io/api/v1/crates/brevi/$v")
          if [ "$code" = 200 ]; then echo "brevi $v is already on crates.io"; echo skip=true >> "$GITHUB_OUTPUT"; fi
      - name: Rust (pinned in .github/rust-version)
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: bash
        run: |
          v=$(cat .github/rust-version)
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"
          rustc -V
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: ${{ steps.check.outputs.skip != 'true' }}
        id: auth
      - name: Publish
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Cargo leaves out any folder holding its own Cargo.toml, but the compiler embeds
          # runtime/brevi_tk/src with include_str!, so hide that manifest while packaging.
          # --no-verify: the build job above already built and tested this exact source.
          mv runtime/brevi_tk/Cargo.toml runtime/brevi_tk/Cargo.toml.off
          cargo publish --locked --no-verify --allow-dirty

  # The sandbox image every agent template runs, pushed to GitHub's registry with the workflow's own token
  # (no account or secret). One Linux job a week: the python3 variant reuses the first build's layers.
  image:
    needs: [build, release]
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.from_release) && needs.release.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/version_sync.py --tag "$TAG"
      - name: Build, test and push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v=${TAG#v}
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER}/brevi-sandbox
          docker build --build-arg BREVI_VERSION=$v -t $img:$v -t $img:latest templates/image
          docker build --build-arg BREVI_VERSION=$v --build-arg PYTHON3_SHIM=1 -t $img:$v-python3 -t $img:python3 templates/image
          docker run --rm $img:$v sh -c 'echo "print(sum(range(10)))" > m.py && brevi run --sandbox m.py' | grep -qx 45
          docker run --rm $img:$v python3 -c 'import brevi; print(brevi.run("print(6 * 7)").stdout, end="")' | grep -qx 42
          docker run --rm $img:$v-python3 python3 -c 'print(sum(range(10)))' | grep -qx 45
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags $img
          docker image ls $img
      # The dev container feature ghcr.io/ets-public/features/brevi (devcontainer/src/brevi); a feature
      # version already published is skipped.
      - name: Publish the dev container feature
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          publish-features: "true"
          base-path-to-features: ./devcontainer/src
          features-namespace: ${{ github.repository_owner }}/features
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The MCP registry checks that the PyPI and npm packages exist and name this server, so it goes last.
  mcp-registry:
    needs: [pypi, npm]
    # Without !cancelled() this is skipped whenever build was (from_release), even though pypi and npm ran.
    if: ${{ !cancelled() && needs.pypi.result == 'success' && needs.npm.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish server.json
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # A new npm version can take a few minutes to show, and the registry checks it exists, so retry.
          for try in 1 2 3 4 5 6; do
            if ./mcp-publisher publish > out.txt 2>&1; then cat out.txt; exit 0; fi
            cat out.txt
            # Re-runs of a release hit the version that is already there.
            if grep -qiE "already (exists|published)|duplicate" out.txt; then exit 0; fi
            sleep 60
          done
          exit 1
