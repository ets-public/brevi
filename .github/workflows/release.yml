# Prebuilt brevi binaries. Push a tag like v0.17.0 (or run this by hand) and each
# platform's binary is built, smoke-tested and attached to that GitHub release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (made if missing), e.g. v0.17.0"
        required: true
      wheels:
        description: "Also build the Python wheels (only needed once PyPI publishing starts)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  # Actions minutes are shared and metered (macOS counts 10x), so: one macOS job builds both Mac
  # targets, and only the Linux x86-64 job runs the full test suite (CI already tests every push to main).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, targets: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-22.04-arm, targets: aarch64-unknown-linux-gnu }
          # Intel Mac images are being retired, so the Intel binary is cross-built on Apple silicon.
          - { os: macos-15, targets: aarch64-apple-darwin x86_64-apple-darwin }
          - { os: windows-2022, targets: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build
        shell: bash
        run: for t in ${{ matrix.targets }}; do cargo build --release --locked --target $t; done
      - name: Smoke test (native target)
        shell: bash
        run: |
          t=$(echo ${{ matrix.targets }} | cut -d' ' -f1)
          printf 'n = 1 + 1\nprint("hi {n}")\n' > smoke.bv
          ./target/$t/release/brevi run smoke.bv | grep -qx "hi 2"
      - name: Unit and language tests
        if: ${{ matrix.test }}
        run: |
          cargo test --release --locked
          BREVI=./target/${{ matrix.targets }}/release/brevi sh tests/check.sh
      - name: Package
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            name=brevi-$t
            mkdir $name
            if [ "$RUNNER_OS" = Windows ]; then cp target/$t/release/brevi.exe $name/; else cp target/$t/release/brevi $name/; fi
            cp LICENSE README.md BREVI.md $name/
            if [ "$RUNNER_OS" = Windows ]; then 7z a $name.zip $name >/dev/null; else tar czf $name.tar.gz $name; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: brevi-${{ matrix.os }}
          path: brevi-*.*
  # Python wheels holding the same binary (packaging/pypi), for `pip install brevi`. They are attached to the
  # release; publishing them to PyPI is a separate step for launch.
  wheels:
    # Off by default: wheels are not published until launch, and this job adds another macOS build.
    if: ${{ github.event.inputs.wheels == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64 }
          - { os: macos-15, target: universal2-apple-darwin }
          - { os: windows-2022, target: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/pypi
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: packaging/pypi/dist/*.whl
  release:
    needs: [build, wheels]
    # Attach whatever built, so one platform's runner trouble does not hold back the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum brevi-* > SHA256SUMS
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Release notes: this tag's section of CHANGELOG.md, then the install note.
          python3 tools/release_notes.py "$TAG" > notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Brevi $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
