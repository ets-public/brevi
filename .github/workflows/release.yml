# Prebuilt brevi binaries. Push a tag like v0.17.0 (or run this by hand) and each
# platform's binary is built, smoke-tested and attached to that GitHub release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (made if missing), e.g. v0.17.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          # Intel Mac images are being retired, so this one is cross-built on Apple silicon.
          - { os: macos-15, target: x86_64-apple-darwin, cross: true }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p target/release && cp target/${{ matrix.target }}/release/brevi* target/release/ 2>/dev/null || true
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          printf 'n = 1 + 1\nprint("hi {n}")\n' > smoke.bv
          ./target/release/brevi run smoke.bv | grep -qx "hi 2"
      - name: Unit and language tests
        if: runner.os != 'Windows' && !matrix.cross
        run: |
          cargo test --release --locked
          BREVI=./target/release/brevi sh tests/check.sh
      - name: Package
        shell: bash
        run: |
          name=brevi-${{ matrix.target }}
          mkdir $name
          if [ "$RUNNER_OS" = Windows ]; then cp target/release/brevi.exe $name/; else cp target/release/brevi $name/; fi
          cp LICENSE README.md BREVI.md $name/
          if [ "$RUNNER_OS" = Windows ]; then 7z a $name.zip $name >/dev/null; else tar czf $name.tar.gz $name; fi
      - uses: actions/upload-artifact@v4
        with:
          name: brevi-${{ matrix.target }}
          path: brevi-${{ matrix.target }}.*
  # Python wheels holding the same binary (packaging/pypi), for `pip install brevi`. They are attached to the
  # release; publishing them to PyPI is a separate step for launch.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64 }
          - { os: macos-15, target: universal2-apple-darwin }
          - { os: windows-2022, target: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/pypi
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: packaging/pypi/dist/*.whl
  release:
    needs: [build, wheels]
    # Attach whatever built, so one platform's runner trouble does not hold back the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum brevi-* > SHA256SUMS
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Brevi $TAG" --notes "Prebuilt brevi compiler. brevi still needs rustc on the PATH to build programs (install.sh fetches it)."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
